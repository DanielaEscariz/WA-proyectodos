<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Error 404</title>

        <!-- Tipografía Inter -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

        <!-- CSS -->
        <link rel="stylesheet" href="css/style.css">        
        
    </head>
    <body>
        <!-- PÁGINA DE ERROR 404 -->
        <main class="pagina-error">
            <div class="contenido-error">

                <!-- LOGO -->
                <a href="index.html" class="logo-error">
                    <img src="media/img/index/riderroute-nombreblanco.webp" alt="RiderRoute">
                </a>

                <!-- MENSAJE DE ERROR -->
                <div class="informacion-error">
                    <span class="numero-error">404</span>

                    <span class="etiqueta-error">ERROR DE NAVEGACIÓN</span>

                    <h1>Te has salido de la ruta.</h1>

                    <p>
                        Parece que este camino todavía no existe.
                        Pero tranquilo, siempre podemos volver a
                        encontrar el rumbo.
                    </p>

                    <a href="index.html" class="boton-error">
                        Volver al inicio
                    </a>

                    <a href="rutas.html" class="enlace-error">
                        O explorar las rutas disponibles
                    </a>
                </div>

                <!-- IMAGEN -->
                <div class="imagen-error">
                    <img src="#" alt="Moteros">
                </div>

                <!-- PIE -->
                <div class="footer-error">
                    <p>© 2026 RiderRoute · Sigue tu propio camino.</p>
                </div>
            </div>
        </main>        
    </body>
</html>
